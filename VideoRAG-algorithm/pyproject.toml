[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videorag"
version = "0.1.0"
description = "VideoRAG: Video Retrieval-Augmented Generation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "lightrag-hku",
    "numpy>=1.19",
]

[tool.setuptools.packages.find]
include = ["videorag*"]
